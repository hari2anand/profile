<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Harish Anand TK — Cloud Platform Architect</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
:root {
  --navy:#0d1f35;
  --teal:#0bbfbd;
  --white:#f0f4f8;
  --white-dim:rgba(240,244,248,0.65);
}
body{margin:0;background:var(--navy);color:var(--white);font-family:'DM Sans',sans-serif}

/* FLOATING CTA */
.floating-resume {
  position:fixed;
  bottom:24px;
  right:24px;
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.floating-btn {
  background:var(--teal);
  color:#000;
  padding:12px 18px;
  border-radius:50px;
  font-weight:600;
  text-decoration:none;
  box-shadow:0 10px 30px rgba(11,191,189,.4);
  transition:.3s;
  animation:pulse 2.5s infinite;
}

.floating-btn:hover{
  transform:translateY(-3px) scale(1.03);
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(11,191,189,.6)}
  70%{box-shadow:0 0 0 14px rgba(11,191,189,0)}
  100%{box-shadow:0 0 0 0 rgba(11,191,189,0)}
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

.modal.open{display:flex;}

.modal-content{
  background:#152d4a;
  padding:30px;
  border-radius:12px;
  text-align:center;
  width:320px;
}

.modal-content h3{
  margin-bottom:20px;
}

.modal-content a{
  display:block;
  margin:10px 0;
  padding:10px;
  background:var(--teal);
  color:#000;
  border-radius:6px;
  text-decoration:none;
  font-weight:600;
}

/* HERO */
.hero{
  padding:100px 20px;
  text-align:center;
}

.hero h1{
  font-family:'Syne';
  font-size:2.5rem;
}

.hero-actions{
  margin-top:20px;
}

.hero-actions a{
  margin:5px;
  padding:10px 16px;
  border:1px solid var(--teal);
  color:var(--teal);
  text-decoration:none;
  border-radius:6px;
}

.hero-actions a.primary{
  background:var(--teal);
  color:#000;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>Harish Anand TK</h1>
  <p>Cloud Platform Architect · DevOps Leader</p>

  <div class="hero-actions">
    <a href="mailto:hari2anand@gmail.com" class="primary">Contact</a>
    <a href="https://linkedin.com/in/harish-anand-tk" target="_blank">LinkedIn</a>
    <a href="#" onclick="openModal()">⬇ Resume</a>
  </div>
</section>

<!-- FLOATING BUTTON -->
<div class="floating-resume">
  <a href="#" class="floating-btn" onclick="openModal()">⬇ Resume</a>
</div>

<!-- MODAL -->
<div class="modal" id="resumeModal">
  <div class="modal-content">
    <h3>Choose version</h3>
    <a href="/assets/Harish_Anand_TK_Platform_Manager_Resume.pdf?v=1.0" target="_blank" onclick="trackClick('resume-main')">Full Resume</a>
    <a href="/assets/Harish_ATK_CV.pdf?v=1.0" target="_blank" onclick="trackClick('cv-main')">2-Page CV</a>
    <a href="#" onclick="closeModal()">Cancel</a>
  </div>
</div>

<script>
function openModal(){
  document.getElementById('resumeModal').classList.add('open');
}
function closeModal(){
  document.getElementById('resumeModal').classList.remove('open');
}

/* TRACKING */
function trackClick(type){
  const key="click_"+type;
  const count=parseInt(localStorage.getItem(key)||"0")+1;
  localStorage.setItem(key,count);
  console.log(type+" clicked:",count);
}
</script>

</body>
</html>
